<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متداول الذهب بالذكاء الاصطناعي</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#101827;
  color:white;
  text-align:center;
}
.container{
  max-width:800px;
  margin:auto;
  padding:20px 15px;
}
h1{color:#f5c542}
.card{
  background:#1b2638;
  padding:20px;
  margin-top:15px;
  border-radius:15px;
}
.price{
  font-size:42px;
  color:#f5c542;
  font-weight:bold;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:15px;
}
.box{
  background:#162235;
  padding:18px 10px;
  border-radius:12px;
}
.label{
  color:#aeb9ca;
  font-size:14px;
}
.value{
  font-size:21px;
  font-weight:bold;
  margin-top:8px;
}
.signal{
  font-size:30px;
  font-weight:bold;
  margin-top:10px;
}
.buy{color:#35d07f}
.sell{color:#ff5964}
.wait{color:#f5c542}
button{
  margin-top:20px;
  padding:15px 30px;
  border:0;
  border-radius:10px;
  background:#f5c542;
  font-size:18px;
  font-weight:bold;
}
.warning{
  margin-top:15px;
  padding:15px;
  background:#3b3015;
  border-radius:10px;
  color:#ffd86b;
  line-height:1.7;
}
#error{
  color:#ff5964;
  margin-top:15px;
}
@media(max-width:600px){
  .grid{grid-template-columns:1fr}
  .price{font-size:36px}
}
</style>
</head>

<body>

<div class="container">

<h1>📈 متداول الذهب بالذكاء الاصطناعي</h1>

<div class="card">

<p>سعر الذهب XAU/USD</p>

<div class="price" id="price">جاري التحميل...</div>

<div id="status">⏳ جاري جلب البيانات...</div>

</div>


<div class="card">

<h2>📊 تحليل السوق</h2>

<div class="grid">

<div class="box">
<div class="label">الاتجاه</div>
<div class="value" id="direction">---</div>
</div>

<div class="box">
<div class="label">قوة الإشارة</div>
<div class="value" id="strength">---</div>
</div>

<div class="box">
<div class="label">RSI</div>
<div class="value" id="rsi">---</div>
</div>

<div class="box">
<div class="label">SMA 20</div>
<div class="value" id="sma20">---</div>
</div>

<div

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متداول الذهب بالذكاء الاصطناعي</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      text-align: center;
      color: #f5c542;
    }

    .card {
      background: #1f2937;
      border-radius: 18px;
      padding: 25px;
      margin-top: 25px;
      text-align: center;
    }

    .symbol {
      font-size: 20px;
      color: #d1d5db;
    }

    .price {
      font-size: 42px;
      font-weight: bold;
      color: #f5c542;
      margin: 25px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #f5c542;
      color: #111827;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      line-height: 1.8;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📈 متداول الذهب بالذكاء الاصطناعي</h1>

  <div class="card">

    <div class="symbol">XAU/USD — الذهب مقابل الدولار</div>

    <div class="price" id="price">--</div>

    <button onclick="getGoldPrice()">
      جلب سعر الذهب
    </button>

    <div id="status">
      اضغط على الزر لجلب السعر الحقيقي.
    </div>

  </div>

</div>

<script>

async function getGoldPrice() {

  const priceElement = document.getElementById("price");
  const statusElement = document.getElementById("status");

  priceElement.innerText = "--";
  statusElement.innerText = "جاري جلب سعر الذهب الحقيقي...";

  try {

    const response = await fetch("https://api.gold-api.com/price/XAU");

    if (!response.ok) {
      throw new Error("API Error");
    }

    const data = await response.json();

    if (!data.price) {
      throw new Error("No price");
    }

    priceElement.innerText =
      "$" + Number(data.price).toFixed(2);

    statusElement.innerText =
      "تم جلب سعر الذهب بنجاح ✅";

  } catch (error) {

    priceElement.innerText = "--";

    statusElement.innerText =
      "تعذر جلب سعر الذهب حاليًا. لم يتم اختلاق أي سعر ❌";

  }

}

</script>

</body>
</html>

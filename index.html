<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متداول الذهب بالذكاء الاصطناعي</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 700px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #f5c542;
    }
    .card {
      background: #1f2937;
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }
    .price {
      font-size: 38px;
      text-align: center;
      color: #f5c542;
      font-weight: bold;
      margin: 20px 0;
    }
    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #f5c542;
      color: #111827;
      font-size: 18px;
      font-weight: bold;
    }
    .status {
      text-align: center;
      margin-top: 20px;
      line-height: 1.8;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>📈 متداول الذهب بالذكاء الاصطناعي</h1>

    <div class="card">
      <h2>XAUUSD - الذهب</h2>

      <div class="price" id="price">--</div>

      <button onclick="analyzeGold()">تحليل الذهب</button>

      <div class="status" id="status">
        اضغط على تحليل الذهب للبدء
      </div>
    </div>
  </div>

  <script>
    async function analyzeGold() {
      const status = document.getElementById("status");
      const price = document.getElementById("price");

      status.innerText = "جاري جلب بيانات الذهب...";

      try {
        const response = await fetch(
          "https://api.xaus.org/v1/xauusd"
        );

        if (!response.ok) {
          throw new Error("تعذر الحصول على بيانات الذهب");
        }

        const data = await response.json();

        const value = data.price ?? data.rate ?? data.xauusd;

        if (!value) {
          throw new Error("مصدر البيانات لم يُرجع سعرًا");
        }

        price.innerText = Number(value).toFixed(2) + " USD";

        status.innerText =
          "تم جلب سعر XAUUSD بنجاح.\n\n" +
          "ملاحظة: هذا سعر السوق فقط، وليس توصية شراء أو بيع.";
      } catch (error) {
        price.innerText = "--";
        status.innerText =
          "تعذر جلب سعر الذهب حاليًا.\n" +
          "لم يتم اختلاق أي سعر.";
      }
    }
  </script>
</body>
</html>

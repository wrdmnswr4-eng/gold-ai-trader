<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متداول الذهب بالذكاء الاصطناعي</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 25px;
    }

    h1 {
      text-align: center;
      color: #f5c542;
    }

    .card {
      background: #1f2937;
      border-radius: 18px;
      padding: 25px;
      margin-top: 25px;
      text-align: center;
    }

    .symbol {
      font-size: 20px;
      color: #d1d5db;
    }

    .price {
      font-size: 42px;
      font-weight: bold;
      color: #f5c542;
      margin: 25px 0;
    }

    .direction {
      font-size: 28px;
      font-weight: bold;
      margin: 20px 0;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: #f5c542;
      color: #111827;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    #status {
      margin-top: 20px;
      line-height: 1.8;
      color: #d1d5db;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>📈 متداول الذهب بالذكاء الاصطناعي</h1>

  <div class="card">

    <div class="symbol">XAU/USD — الذهب مقابل الدولار</div>

    <div class="price" id="price">--</div>

    <div class="direction" id="direction">
      اتجاه السوق: --
    </div>

    <button onclick="analyzeGold()">
      🔍 تحليل اتجاه الذهب
    </button>

    <div id="status">
      اضغط على الزر لبدء التحليل.
    </div>

  </div>

</div>

<script>

async function analyzeGold() {

  const priceElement = document.getElementById("price");
  const directionElement = document.getElementById("direction");
  const statusElement = document.getElementById("status");

  priceElement.innerText = "--";
  directionElement.innerText = "جاري التحليل...";
  statusElement.innerText = "جاري جلب بيانات الذهب الحقيقية...";

  try {

    // السعر الحالي
    const priceResponse =
      await fetch("https://api.gold-api.com/price/XAU");

    if (!priceResponse.ok) {
      throw new Error("Price API Error");
    }

    const priceData = await priceResponse.json();

    if (!priceData.price) {
      throw new Error("No current price");
    }

    const currentPrice = Number(priceData.price);

    priceElement.innerText =
      "$" + currentPrice.toFixed(2);

    // البيانات التاريخية
    const historyResponse =
      await fetch("https://xaus.com/api/v1/history");

    if (!historyResponse.ok) {
      throw new Error("History API Error");
    }

    const historyData = await historyResponse.json();

    if (!historyData.points || historyData.points.length < 2) {
      throw new Error("Not enough history");
    }

    const points = historyData.points;

    const lastPoint = points[points.length - 1];
    const previousPoint = points[points.length - 2];

    const lastClose = Number(lastPoint.c);
    const previousClose = Number(previousPoint.c);

    if (lastClose > previousClose) {

      directionElement.innerText =
        "📈 اتجاه السوق: صاعد";

      directionElement.style.color = "#22c55e";

    } else if (lastClose < previousClose) {

      directionElement.innerText =
        "📉 اتجاه السوق: هابط";

      directionElement.style.color = "#ef4444";

    } else {

      directionElement.innerText =
        "🟡 اتجاه السوق: محايد";

      directionElement.style.color = "#f5c542";
    }

    statusElement.innerText =
      "تم التحليل اعتمادًا على بيانات الذهب الحقيقية ✅";

  } catch (error) {

    priceElement.innerText = "--";

    directionElement.innerText =
      "اتجاه السوق: غير متاح";

    directionElement.style.color = "#f5c542";

    statusElement.innerText =
      "تعذر جلب البيانات حاليًا. لم يتم اختلاق أي سعر أو اتجاه ❌";
  }

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متداول الذهب</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #101827;
  color: white;
  text-align: center;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 30px 15px;
}

h1 {
  color: #f5c542;
}

.card {
  background: #1b2638;
  padding: 25px;
  margin-top: 20px;
  border-radius: 15px;
}

.price {
  font-size: 42px;
  color: #f5c542;
  font-weight: bold;
}

.direction {
  font-size: 28px;
  margin-top: 20px;
}

button {
  margin-top: 25px;
  padding: 15px 30px;
  border: 0;
  border-radius: 10px;
  background: #f5c542;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>📈 متداول الذهب بالذكاء الاصطناعي</h1>

<div class="card">

<p>سعر الذهب XAU/USD</p>

<div class="price" id="price">
جاري التحميل...
</div>

<div class="direction" id="direction">
⏳ جاري التحليل...
</div>

<p id="status"></p>

<button onclick="loadGold()">
🔄 تحديث
</button>

</div>

</div>

<script>

async function loadGold() {

  const priceElement =
    document.getElementById("price");

  const directionElement =
    document.getElementById("direction");

  const statusElement =
    document.getElementById("status");

  try {

    statusElement.textContent =
      "جاري جلب البيانات الحقيقية...";

    const response =
      await fetch("https://api.gold-api.com/price/XAU");

    if (!response.ok) {
      throw new Error("فشل الاتصال بمصدر الذهب");
    }

    const data =
      await response.json();

    const price =
      Number(data.price);

    if (!price) {
      throw new Error("السعر غير موجود");
    }

    priceElement.textContent =
      "$" + price.toFixed(2);

    directionElement.textContent =
      "📊 تم جلب السعر بنجاح";

    statusElement.textContent =
      "✅ بيانات حقيقية";

  } catch (error) {

    priceElement.textContent =
      "---";

    directionElement.textContent =
      "❌ تعذر جلب البيانات";

    statusElement.textContent =
      error.message;

  }

}

loadGold();

</script>

</body>
</html>
